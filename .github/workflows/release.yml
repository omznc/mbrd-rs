# Builds an executable for every desktop platform and attaches it to a GitHub
# release.
#
# Triggered by pushing a tag: `git tag v0.2.0 && git push origin v0.2.0`. The
# tag has to match the workspace version in Cargo.toml — the `notes` job checks
# it and stops the run rather than publishing a release whose name and contents
# disagree.
name: Release

on:
  push:
    tags: ["v*"]
  # Useful for proving the matrix still builds without cutting a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The version and the release body, worked out once. Its own job rather than
  # a step in each build, because four jobs generating the body independently
  # is four chances for them to disagree about what the release says, and
  # because the draft has to exist before anything can upload into it.
  notes:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # `scripts/changelog.mjs` walks back to the previous tag to find its
          # range, and the default shallow clone has neither the tag nor the
          # commits between.
          fetch-depth: 0

      - id: version
        env:
          REF: ${{ github.ref_name }}
        run: |
          # The first `version = ` in Cargo.toml is `[workspace.package]`'s,
          # which is the one every crate inherits. Read rather than parsed
          # with `cargo metadata`, which would want the registry to answer
          # before it would tell us a number that is sitting in the file.
          VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "workspace version is $VERSION"

          # Only on a tag. A manual run's ref name is the branch.
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${REF#v}" != "$VERSION" ]; then
            echo "::error::tag $REF does not match the workspace version $VERSION."
            echo "::error::Bump it in Cargo.toml, or move the tag."
            exit 1
          fi

      # Created here, empty, so the four build jobs have somewhere to upload
      # and none of them has to race the others to make it. A draft, so it can
      # be looked at — and so a half-finished matrix is not a download page.
      - name: Open the draft release
        if: github.ref_type == 'tag'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ github.ref_name }}
        run: |
          {
            node scripts/changelog.mjs "$REF"
            echo
            echo '---'
            echo
            cat .github/install-notes.md
          } > release-notes.md

          gh release create "$REF" --draft \
            --title "mbrd $REF" \
            --notes-file release-notes.md

  build:
    needs: notes
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon and Intel are separate downloads; a universal binary
          # would double the size of both for the sake of one artifact. Both
          # are built on the arm64 runner — Metal shaders compile to
          # architecture-independent AIR, so the cross-compile is free.
          - platform: macos-latest
            target: aarch64-apple-darwin
            arch: aarch64
          - platform: macos-latest
            target: x86_64-apple-darwin
            arch: x64
          # Pinned deliberately: the binary links against whatever glibc the
          # runner has, so building on the newest Ubuntu would refuse to start
          # on anything older.
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            arch: x86_64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x64
            # Links the Visual C++ runtime in, so the exe runs on a machine
            # that has never had a redistributable installed — which is the
            # whole point of handing somebody a single file.
            rustflags: -C target-feature=+crt-static

    runs-on: ${{ matrix.platform }}
    env:
      VERSION: ${{ needs.notes.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # gpui's Linux backend, and the font stack under it. `libxkbcommon-x11`
      # is needed whether or not X11 is in use — the dependency is not
      # feature-gated upstream — and its absence surfaces as a link failure,
      # not a compile one. See the README.
      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libfontconfig-dev \
            libfreetype6-dev \
            libxcb1-dev \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: ${{ matrix.target }}

      # gpui compiles its HLSL shaders with fxc.exe from the Windows SDK. It
      # looks on PATH first, then at one hardcoded SDK version — neither of
      # which is reliable on a runner whose SDK moves — so find it and say
      # where it is. This is also the reason the Windows build cannot be
      # cross-compiled from Linux: gpui's build script gates the whole shader
      # step on the *host* being Windows, so a cross build skips it silently
      # and then fails on the bindings that step was meant to write.
      - name: Install NSIS
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis --no-progress -y
          }
          # No plugins. `mbrd.nsi`'s running-copy check uses `System.dll`,
          # which base NSIS carries — the `FindProcDLL` plugin it once wanted
          # is no longer on Chocolatey, and a `pwsh` step cannot even shrug a
          # failed `choco` off: the runner appends `exit $LASTEXITCODE`, so
          # the `|| continue` that guarded it never actually continued.

      - name: Find the shader compiler
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" `
                   -Recurse -Filter fxc.exe -ErrorAction SilentlyContinue |
                 Where-Object { $_.FullName -like "*\x64\*" } |
                 Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $fxc) { throw "fxc.exe not found; no Windows SDK on this runner" }
          Write-Host "using $($fxc.FullName)"
          "GPUI_FXC_PATH=$($fxc.FullName)" | Out-File -Append $env:GITHUB_ENV

      - name: Build
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
          # The key the updater verifies against, baked in. A repository
          # *variable*, not a secret — it is a public key, and hiding it would
          # only hide it from the people who might want to check a release
          # against it. A build without it cannot install anything at all; see
          # crates/app/src/update/mod.rs.
          MBRD_UPDATE_KEY: ${{ vars.MBRD_UPDATE_PUBLIC_KEY }}
        run: cargo build --release -p mbrd --target ${{ matrix.target }}

      # A `.app`, because a bare Mach-O has no name in the menu bar, no Dock
      # identity and cannot be double-clicked; then a `.dmg`, because that is
      # how a Mac application is handed over. The ad-hoc `codesign` is not
      # security — it is what makes the bundle runnable at all on Apple
      # Silicon, where an unsigned binary is killed on launch.
      - name: Package the macOS app
        if: runner.os == 'macOS'
        run: |
          APP="stage/mbrd.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" dist
          sed "s/__VERSION__/$VERSION/g" packaging/macos/Info.plist \
            > "$APP/Contents/Info.plist"
          cp "target/${{ matrix.target }}/release/mbrd" "$APP/Contents/MacOS/mbrd"
          cp packaging/icons/mbrd.icns "$APP/Contents/Resources/mbrd.icns"
          chmod +x "$APP/Contents/MacOS/mbrd"
          codesign --force --deep --sign - "$APP"

          # The updater's copy, tarred *after* the signature so the bundle it
          # installs is the one macOS will run. A `.dmg` would need `hdiutil
          # attach` and a mounted filesystem to read one directory out of; a
          # tarball needs two crates and no subprocess. See SHIPPING.md.
          tar -czf "dist/mbrd_${VERSION}_${{ matrix.arch }}.app.tar.gz" \
            -C stage mbrd.app

          # The symlink is what makes the window that opens a drag-to-install
          # rather than a folder with a mystery in it.
          ln -s /Applications stage/Applications
          hdiutil create -volname mbrd -srcfolder stage -ov -format UDZO \
            "dist/mbrd_${VERSION}_${{ matrix.arch }}.dmg"

      - name: Package the Linux binary
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          tar -czf "dist/mbrd_${VERSION}_${{ matrix.arch }}-linux.tar.gz" \
            -C "target/${{ matrix.target }}/release" mbrd

      # One file that runs on any desktop from the glibc floor upward, with
      # its own copies of the shared libraries the tarball expects to find.
      # This is the answer to "standalone" on the one platform where the app
      # is not already: Windows links its runtime statically and macOS ships a
      # bundle, and Linux has neither until this exists.
      - name: Package the AppImage
        if: runner.os == 'Linux'
        run: |
          curl -fsSLo /tmp/linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x /tmp/linuxdeploy

          # The runner has no FUSE, so the AppImages we *use* have to be
          # unpacked rather than mounted. The one we produce is unaffected.
          ( cd /tmp && ./linuxdeploy --appimage-extract >/dev/null )

          mkdir -p AppDir/usr/bin
          cp "target/${{ matrix.target }}/release/mbrd" AppDir/usr/bin/mbrd

          APPIMAGE_EXTRACT_AND_RUN=1 /tmp/squashfs-root/AppRun \
            --appdir AppDir \
            --executable AppDir/usr/bin/mbrd \
            --desktop-file packaging/linux/mbrd.desktop \
            --icon-file packaging/icons/hicolor/256x256/apps/mbrd.png \
            --output appimage

          mv mbrd*.AppImage "dist/mbrd_${VERSION}_${{ matrix.arch }}.AppImage"

      # Native packages, for people who would rather their package manager
      # knew about this. Both set MBRD_PACKAGED, which is what stops the
      # in-app updater writing over a file dpkg or rpm believes it owns —
      # see crates/app/src/update/eligible.rs.
      - name: Package the deb and the rpm
        if: runner.os == 'Linux'
        env:
          MBRD_PACKAGED: "1"
        run: |
          cargo install cargo-deb cargo-generate-rpm --locked

          # Both tools read `target/release`, not `target/<triple>/release`,
          # and the matrix builds into the latter. Rebuild rather than copy:
          # the marker above changes the binary, so this is a genuinely
          # different build and not the same one in a different place.
          cargo build --release -p mbrd

          cargo deb -p mbrd --no-build --output \
            "dist/mbrd_${VERSION}_amd64.deb"
          cargo generate-rpm -p crates/app --output \
            "dist/mbrd-${VERSION}-1.x86_64.rpm"

      # No installer. One file, which is what somebody being sent a copy wants,
      # and there is nothing to install alongside it.
      - name: Package the Windows exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\mbrd.exe" `
            "dist\mbrd_${env:VERSION}_${{ matrix.arch }}.exe"
          # The name the installer script expects to find it under. The
          # portable artifact carries the version in its name and the
          # installed one must not, because the updater replaces it in place.
          Copy-Item "target\${{ matrix.target }}\release\mbrd.exe" "dist\mbrd.exe"

      # An installer as well as the portable exe, not instead of it. Per-user,
      # which means no UAC prompt and — the reason that matters here — an
      # installed executable the app can still write to, so the in-app updater
      # works in the installed location. See packaging/windows/mbrd.nsi.
      - name: Package the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" `
            "/DVERSION=${env:VERSION}" packaging\windows\mbrd.nsi
          Remove-Item "dist\mbrd.exe"

      - name: Size
        shell: bash
        run: ls -lh dist

      - name: Attach to the release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" dist/* --clobber

      # A manual run publishes nothing, so the builds would die with the
      # runner. Downloading them from here is how you check the app actually
      # starts on a platform you don't own, before committing to a tag.
      - name: Upload for inspection
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: mbrd-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  # What the in-app updater reads, and the only thing standing between a
  # release download and arbitrary code execution on somebody's machine —
  # nothing here is signed by Apple or Microsoft, so this signature is the
  # entire trust boundary. See SHIPPING.md.
  #
  # Last, and its own job, because it hashes the artifacts the four build jobs
  # produced: it cannot run until all of them have finished, and it must not
  # run if any of them failed. `needs` gives both.
  manifest:
    needs: [notes, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    environment: release
    env:
      VERSION: ${{ needs.notes.outputs.version }}
      REF: ${{ github.ref_name }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      # `rsign2`, not the `minisign` apt package, and the difference matters.
      # The key was generated with rsign, and rsign is what is known to read
      # it back: the two implementations agree on the *signature* format, but
      # whether one reads the other's passwordless secret key is an assumption
      # nobody here has tested. On the one path that would break the trust
      # root, using the tool that made the key removes the question.
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          key: rsign
      - name: Install rsign
        run: cargo install rsign2 --locked

      # From the release rather than from the build jobs' workspaces, so what
      # is hashed is what somebody will actually download — including anything
      # GitHub did to it on the way in.
      - name: Fetch the artifacts
        run: |
          mkdir -p dist
          gh release download "$REF" --dir dist --pattern '*'
          ls -lh dist

      - name: Write the manifest
        run: |
          # The updater is indexed by target triple, so the map is written by
          # hand rather than derived: the triple a binary was *built* for is
          # not recoverable from the name of the file it ended up in, and
          # guessing it wrong would offer somebody another platform's build.
          write() {
            local triple="$1" file="dist/$2"
            if [ ! -f "$file" ]; then
              echo "::error::$file is missing; the $triple build did not publish"
              exit 1
            fi
            printf '%s %s %s %s\n' "$triple" "$2" \
              "$(stat -c%s "$file")" \
              "$(sha256sum "$file" | cut -d" " -f1)"
          }

          {
            write aarch64-apple-darwin     "mbrd_${VERSION}_aarch64.app.tar.gz"
            write x86_64-apple-darwin      "mbrd_${VERSION}_x64.app.tar.gz"
            write x86_64-pc-windows-msvc   "mbrd_${VERSION}_x64.exe"
            write x86_64-unknown-linux-gnu "mbrd_${VERSION}_x86_64-linux.tar.gz"
          } > targets.txt

          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${REF}"
          {
            printf '{\n  "version": "%s",\n' "$VERSION"
            printf '  "notes": "https://github.com/%s/releases/tag/%s",\n' \
              "$GITHUB_REPOSITORY" "$REF"
            printf '  "targets": {\n'
            first=1
            while read -r triple file size sha; do
              [ $first -eq 1 ] || printf ',\n'
              first=0
              printf '    "%s": { "url": "%s/%s", "size": %s, "sha256": "%s" }' \
                "$triple" "$BASE" "$file" "$size" "$sha"
            done < targets.txt
            printf '\n  }\n}\n'
          } > latest.json

          cat latest.json
          # Fail here rather than shipping something the client will refuse.
          python3 -c "import json,sys; json.load(open('latest.json'))"

      - name: Sign it
        env:
          SECRET_KEY: ${{ secrets.MBRD_UPDATE_SECRET_KEY }}
          PUBLIC_KEY: ${{ vars.MBRD_UPDATE_PUBLIC_KEY }}
        run: |
          if [ -z "$SECRET_KEY" ]; then
            echo "::error::MBRD_UPDATE_SECRET_KEY is not set."
            echo "::error::Without it the release has no manifest and no"
            echo "::error::existing install will be offered this version."
            exit 1
          fi
          if [ -z "$PUBLIC_KEY" ]; then
            echo "::error::MBRD_UPDATE_PUBLIC_KEY is not set, so the binaries"
            echo "::error::in this release were built unable to verify anything."
            exit 1
          fi

          printf '%s\n' "$SECRET_KEY" > /tmp/mbrd.key
          chmod 600 /tmp/mbrd.key

          # `-H` prehashes. Not optional: the client calls minisign-verify with
          # `allow_legacy: false`, which refuses a non-prehashed signature
          # outright, and a release signed without it would be refused by every
          # install with no useful error anywhere. `manifest.rs` has a test for
          # the pairing. `-W` because the key carries no password — it is a
          # GitHub secret, and a password held as a second GitHub secret would
          # protect it from nothing the first is not already exposed to.
          rsign sign -W -H -s /tmp/mbrd.key -x latest.json.minisig latest.json
          shred -u /tmp/mbrd.key

          # Verify what was just signed against the *public* key the binaries
          # in this very release were compiled with. If the two halves have
          # drifted apart, every install refuses every update and the only
          # symptom is that nobody is ever offered one — so it is checked here,
          # where it is still a failed job rather than a silent dead release.
          rsign verify -P "$PUBLIC_KEY" -x latest.json.minisig latest.json

      - name: Attach it to the release
        run: gh release upload "$REF" latest.json latest.json.minisig --clobber
