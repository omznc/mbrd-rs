[workspace]
members = ["crates/core", "crates/app"]
resolver = "2"

[workspace.package]
version = "0.4.2"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1"
# Pinned to the line gpui itself uses, so `image::Frame` here and
# `image::Frame` inside `RenderImage` are the same type rather than two.
image = "0.25"
# The update path, and following a pasted link in `fetch.rs`. `ureq` is
# blocking and runs on gpui's background executor, which is the whole reason it
# is here rather than reqwest: an async client would mean standing a tokio
# runtime up beside gpui's own executor for a handful of requests a year. This
# is now the *only* HTTP in the binary — the framework used to drag a reqwest
# and a tokio into the lockfile through its own client crate and no longer
# does, while still defaulting to a client that answers nothing — so the
# question of which of two stacks to reach for has stopped being a question.
# `minisign-verify` verifies and cannot sign, which is the only half that
# belongs in a binary handed to other people.
flate2 = "1"
# Sound and video, three times over. Every one of these is a *binding* and
# carries no codec of its own: what plays is whatever the machine's own media
# stack can already play, which is why there is one of these per platform
# rather than a pile of vendored decoders, a patent question per format, and a
# video card that still could not use the GPU somebody has.
#
# The split is a shipping decision and it is argued in `main.rs`,
# `pipeline.rs` and `RELEASING.md`. Briefly: GStreamer is the best of the three
# and the only one that is a *system* dependency, which on Linux is free and on
# the other two would cost Windows its single-file portable `.exe` and macOS a
# bundled framework and a real signature. AVFoundation and Media Foundation are
# already in those operating systems.

# Linux. `-app` is the sink frames come back through and `-video` reads the
# frame layout; both track `gstreamer` itself and are not separable from it.
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-video = "0.25"

# macOS. Features rather than the whole of AVFoundation, which is enormous:
# what is wanted is a player, an item and a video output, plus the two Core
# frameworks that carry a timestamp and a pixel buffer between them.
objc2 = "0.6"
objc2-av-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "AVPlayer",
    "AVPlayerItem",
    "AVPlayerItemOutput",
    "objc2-core-media",
    "objc2-core-video",
    # `AVPlayerItem::presentationSize`, which is a `CGSize` and so is gated on
    # Core Foundation. It is what lets the video output be asked for frames at
    # the size they will be *drawn* rather than the size they were shot — see
    # the note on `LONGEST_SIDE` in `pipeline_mac.rs`, which is about why a
    # 4K frame must not reach the thread that draws.
    "objc2-core-foundation",
] }
# `objc2` on each of these is the interop half — the `Encode` and `Retained`
# impls that let a `CMTime` cross a message send and a pixel buffer be held.
# It is in their defaults, and these turn defaults off to keep the compile
# down, so it has to be named.
objc2-core-media = { version = "0.3", default-features = false, features = [
    "std",
    "objc2",
    "CMTime",
] }
objc2-core-video = { version = "0.3", default-features = false, features = [
    "std",
    "objc2",
    "CVBase",
    "CVBuffer",
    "CVImageBuffer",
    "CVPixelBuffer",
    "CVReturn",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSDictionary",
    "NSError",
    "NSObject",
    "NSString",
    "NSURL",
    "NSValue",
] }

# Windows. Features rather than the whole of Win32, which is a third of a
# gigabyte of generated bindings. `implement` needs no feature of its own, which
# matters here: the Media Engine will not be created without a callback, so one
# COM interface has to be implemented rather than only called.
#
# `windows-core` is named separately even though `windows` re-exports it as
# `windows::core`, because `#[implement]` expands to absolute `windows_core::`
# paths and those only resolve if the crate is in the graph under that name. The
# version has to track `windows`, or the macro would implement a `IUnknownImpl`
# from a different copy of the trait than the one `windows` asks for.
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Imaging",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
] }
# A PDF's page count and the text pulled out of it, with no rasteriser
# anywhere behind it: a rasteriser is a native dependency, and that is not the
# price of entry for reading what a PDF actually says.
lopdf = "0.44"
minisign-verify = "0.2"
# The Markdown front end. `default-features = false` because the crate also
# ships an HTML writer and a `getopts` CLI, and this build wants neither: what
# is used here is the pull parser and the source ranges it hands back with
# every event, which is what lets a block remember which bytes of the note it
# came from.
pulldown-cmark = { version = "0.13", default-features = false }
# The highest value per unit of work in the whole preview list: an SVG shown
# as a picture rather than as its own XML, and its markup still one Edit button
# away. Re-exports `usvg` and `tiny_skia`, so nothing else here needs to depend
# on either directly.
resvg = "0.48"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tar = "0.4"
# Reads a dropped font's own name table so its specimen sheet can be set in
# its own face rather than in a label saying what the file is called.
ttf-parser = "0.25"
# The only irreversible action in the app is a board delete, and this is what
# stops it from being one: `trash::delete` implements the freedesktop trash
# spec on Linux and the native Recycle Bin / Trash on Windows and macOS,
# natively, with no system dependencies to shell out to.
trash = "5"
ureq = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }

# What a build sent to somebody else is compiled with. `strip` and `lto`
# together take the biggest bite out of an executable that is mostly gpui;
# `panic = "abort"` drops the unwinding tables, which is safe here because
# nothing in the app or in gpui outside its test support catches a panic.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# What a development build is compiled with, and it is not the default.
#
# A canvas is one of the few kinds of program where an unoptimised build is not
# merely slower but *differently behaved*: the per-frame work here — building
# the spatial index, laying out a screenful, pushing quads — measures eight to
# ten times its release cost at `opt-level = 0`, which turns a board that drags
# smoothly into one that does not. Testing a gesture against a debug build is
# then testing the wrong program.
#
# `1` rather than `3` for our own crates, because that is most of the win while
# keeping the compile fast and the backtraces readable; `3` for dependencies,
# which are compiled once and then cached, and which is where `gpui`, `image`
# and the decoders live.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
