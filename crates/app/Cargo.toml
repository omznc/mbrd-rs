[package]
name = "mbrd"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A moodboard on an endless canvas."

[[bin]]
name = "mbrd"
path = "src/main.rs"

[dependencies]
mbrd-core = { path = "../core" }
anyhow.workspace = true
flate2.workspace = true
# The framework, from the community fork rather than from Zed.
#
# `gpui 0.2.2` on crates.io is October 2025 and Zed has not published since,
# while `crates/gpui` in their tree has moved five hundred commits past it —
# so the choice was never "old crate or new crate", it was which *unpublished*
# line to follow. `gpui-ce` follows Zed's (it resyncs upstream on a schedule)
# and is the one of the two that cuts releases, which is why this is a version
# and not a `git =` with a `rev` nobody would ever remember to move.
#
# The fork also takes the changes an app that is not Zed needs. Two of them are
# already load-bearing here: `SurfaceSource::Texture` on Linux, which is the
# GPU path a video frame can take instead of the copy `pipeline.rs` makes of
# every one of them, and Wayland window icons.
#
# `gpui` is core only now — the windowing, text and renderer backends live in
# `gpui_platform`, which picks one per host. The three features are that
# choice: fontconfig for Linux's font sources, and both display servers, since
# a binary that runs on Wayland *or* X11 has to carry both. They are inert on
# macOS and Windows, which have exactly one of each.
gpui = { package = "gpui-ce", version = "0.2.2" }
gpui_platform = { package = "gpui_ce_platform", version = "0.1", features = [
    "font-kit",
    "wayland",
    "x11",
] }
image.workspace = true
lopdf.workspace = true
minisign-verify.workspace = true
resvg.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
ttf-parser.workspace = true

# WASM EXPERIMENT: native-only deps
[target.'cfg(not(target_family = "wasm"))'.dependencies]
trash.workspace = true
ureq.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
futures = "0.3"
web-sys = { version = "0.3", features = [
    "Blob",
    "BlobPropertyBag",
    "CanvasRenderingContext2d",
    "ClipboardEvent",
    "CssStyleDeclaration",
    "DataTransfer",
    "DataTransferItem",
    "DataTransferItemList",
    "Document",
    "DragEvent",
    "Element",
    "ErrorCallback",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "FileSystemDirectoryEntry",
    "FileSystemDirectoryReader",
    "FileSystemEntry",
    "FileSystemFileEntry",
    "HtmlAnchorElement",
    "HtmlAudioElement",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlMediaElement",
    "HtmlVideoElement",
    "ImageData",
    "MediaError",
    "Node",
    "Response",
    "Url",
    "WebGlRenderingContext",
    "IdbDatabase",
    "IdbFactory",
    "IdbObjectStore",
    "IdbOpenDbRequest",
    "IdbRequest",
    "IdbTransaction",
    "IdbTransactionMode",
    "Location",
    "DomStringList",
    "Window",
] }
web-time = "1"
log = "0.4"

# One media backend per platform, and none of them shared. See `main.rs`, which
# is where the three files behind `mod pipeline` are chosen between, and the
# workspace manifest, which has the argument for why it is three.

# Linux: GStreamer, which is a link-time dependency and the only one of the
# three that is not already part of the operating system. Every Linux desktop
# has it; the packages name it in `depends` below.
[target.'cfg(target_os = "linux")'.dependencies]
gstreamer.workspace = true
gstreamer-app.workspace = true
gstreamer-video.workspace = true

# macOS: AVFoundation, which ships with the system. Nothing to install, nothing
# to bundle, and the `.app` stays exactly as standalone as it was.
[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-av-foundation.workspace = true
objc2-core-media.workspace = true
objc2-core-video.workspace = true
objc2-foundation.workspace = true

# Windows: the Media Foundation Media Engine, which also ships with the system —
# so the portable `.exe` is still one file.
[target.'cfg(target_os = "windows")'.dependencies]
windows.workspace = true
windows-core.workspace = true

# Only to put an icon on the Windows executable — but declared unconditionally
# on purpose. Cargo evaluates `[target.'cfg(...)'.build-dependencies]` against
# the **host**, not the target, so gating this on `cfg(windows)` would remove
# it from every Linux and macOS build of the build script — including a
# Windows *cross*-build from Linux, which is the one case the gate looks like
# it is for. `build.rs` asks `CARGO_CFG_TARGET_OS` instead, which is the
# question that was meant.
[build-dependencies]
embed-resource = "3"

# The Linux packages, built by the release workflow with `cargo-deb` and
# `cargo-generate-rpm`. Both install the same five things: the binary, the
# desktop entry, the MIME type, the icons, and nothing else.
#
# Both also set `MBRD_PACKAGED`, which is what stops the in-app updater
# replacing a file `dpkg` or `rpm` believes it owns — see
# `src/update/eligible.rs`. A package that forgot it would still be caught by
# the `/usr` prefix check, but the marker is the exact answer and the prefix
# check is the safety net.
[package.metadata.deb]
name = "mbrd"
maintainer = "omznc"
section = "graphics"
priority = "optional"
# The floor the release build is compiled against — Ubuntu 22.04's glibc. See
# RELEASING.md for why the runner is pinned there.
# The GStreamer pair are hard dependencies rather than recommendations: they
# are linked, so the binary does not start without them. See `pipeline.rs`.
depends = "libc6 (>= 2.35), libxkbcommon-x11-0, libfontconfig1, libfreetype6, libgstreamer1.0-0, libgstreamer-plugins-base1.0-0"
# The decoders. Not `depends`, because a machine missing them still runs the
# app and every card on a board — only the play button says it cannot, which
# is exactly what `pipeline.rs` reports a broken reel as. `libav` is where H.264
# and AAC actually come from, and is what makes a phone video play.
recommends = "gstreamer1.0-plugins-base, gstreamer1.0-plugins-good, gstreamer1.0-libav"
extended-description = """A moodboard on an endless canvas. Pan, zoom, drop images, notes and connections onto a board that has no edges, and save it as a single .mbrd file that travels."""
assets = [
    ["../../target/release/mbrd", "usr/bin/", "755"],
    ["../../packaging/linux/mbrd.desktop", "usr/share/applications/", "644"],
    ["../../packaging/linux/mbrd.xml", "usr/share/mime/packages/", "644"],
    ["../../packaging/icons/hicolor/**/*", "usr/share/icons/hicolor/", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "../../target/release/mbrd", dest = "/usr/bin/mbrd", mode = "755" },
    { source = "../../packaging/linux/mbrd.desktop", dest = "/usr/share/applications/mbrd.desktop", mode = "644" },
    { source = "../../packaging/linux/mbrd.xml", dest = "/usr/share/mime/packages/mbrd.xml", mode = "644" },
    { source = "../../packaging/icons/hicolor/scalable/apps/mbrd.svg", dest = "/usr/share/icons/hicolor/scalable/apps/mbrd.svg", mode = "644" },
    { source = "../../packaging/icons/hicolor/256x256/apps/mbrd.png", dest = "/usr/share/icons/hicolor/256x256/apps/mbrd.png", mode = "644" },
    { source = "../../packaging/icons/hicolor/128x128/apps/mbrd.png", dest = "/usr/share/icons/hicolor/128x128/apps/mbrd.png", mode = "644" },
    { source = "../../packaging/icons/hicolor/48x48/apps/mbrd.png", dest = "/usr/share/icons/hicolor/48x48/apps/mbrd.png", mode = "644" },
]

[package.metadata.generate-rpm.requires]
glibc = ">= 2.35"
libxkbcommon-x11 = "*"
fontconfig = "*"
freetype = "*"
# Linked, so required. The decoders are not listed: rpm has no `Recommends`
# that `cargo-generate-rpm` writes, and every Fedora desktop pulls the plugin
# sets in already. See the deb block above for the reasoning.
gstreamer1 = "*"
gstreamer1-plugins-base = "*"
